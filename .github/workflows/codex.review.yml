name: Codex Review

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate bot and canvas runtime
        run: npm test

      - name: Commit regenerated npm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate npm lockfile for canvas 3"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Emit summary
        run: |
          echo "Discord bot Codex review:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node.js 22 runtime pinned" >> "$GITHUB_STEP_SUMMARY"
          echo "- canvas native module loaded successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- bot syntax checks passed" >> "$GITHUB_STEP_SUMMARY"
