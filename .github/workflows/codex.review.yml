name: Codex Review

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bot source
        run: npm test

      - name: Validate Canvas runtime
        run: node -e "const { createCanvas } = require('canvas'); const canvas = createCanvas(2, 2); if (!canvas.toBuffer('image/png').length) process.exit(1);"

      - name: Emit summary
        run: |
          echo "Discord bot Codex review:" >> $GITHUB_STEP_SUMMARY
          echo "- aha.exe branding active" >> $GITHUB_STEP_SUMMARY
          echo "- Embed system validated" >> $GITHUB_STEP_SUMMARY
