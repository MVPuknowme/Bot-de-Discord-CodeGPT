name: Codex Review

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate bot, dev container, and canvas runtime
        run: npm test

      - name: Emit summary
        run: |
          echo "Discord bot Codex review:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node.js 22 runtime pinned" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm lockfile install reproduced with npm ci" >> "$GITHUB_STEP_SUMMARY"
          echo "- devcontainer.json parsed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- canvas native module loaded successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- bot syntax checks passed" >> "$GITHUB_STEP_SUMMARY"
